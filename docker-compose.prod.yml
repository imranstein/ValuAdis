services:
  # Nginx Reverse Proxy with SSL
  nginx:
    image: nginx:alpine
    container_name: valuadis_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/letsencrypt:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - valuadis_network

  # PostgreSQL with PostGIS
  db:
    image: postgis/postgis:15-3.3
    container_name: valuadis_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-valuadis}
      POSTGRES_USER: ${POSTGRES_USER:-valuadis_user}
      POSTGRES_PASSWORD: ${PROD_POSTGRES_PASSWORD:?Set PROD_POSTGRES_PASSWORD for production}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - valuadis_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-valuadis_user} -d ${POSTGRES_DB:-valuadis}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: valuadis_redis
    environment:
      REDIS_PASSWORD: ${PROD_REDIS_PASSWORD:?Set PROD_REDIS_PASSWORD for production}
    command: redis-server --requirepass ${PROD_REDIS_PASSWORD:?Set PROD_REDIS_PASSWORD for production} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - valuadis_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: valuadis_backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-valuadis_user}:${PROD_POSTGRES_PASSWORD:?Set PROD_POSTGRES_PASSWORD for production}@db:5432/${POSTGRES_DB:-valuadis}
      REDIS_URL: redis://:${PROD_REDIS_PASSWORD:?Set PROD_REDIS_PASSWORD for production}@redis:6379/0
      SECRET_KEY: ${PROD_SECRET_KEY:?Set PROD_SECRET_KEY for production}
      ALLOWED_HOSTS: ${PROD_ALLOWED_HOSTS:?Set PROD_ALLOWED_HOSTS for production}
      ENVIRONMENT: production
      MPESA_CONSUMER_KEY: ${PROD_MPESA_CONSUMER_KEY:-}
      MPESA_CONSUMER_SECRET: ${PROD_MPESA_CONSUMER_SECRET:-}
      MPESA_SHORTCODE: ${PROD_MPESA_SHORTCODE:-}
      MPESA_PASSKEY: ${PROD_MPESA_PASSKEY:-}
      SMTP_HOST: ${PROD_SMTP_HOST:-}
      SMTP_PORT: ${PROD_SMTP_PORT:-}
      SMTP_USER: ${PROD_SMTP_USER:-}
      SMTP_PASSWORD: ${PROD_SMTP_PASSWORD:-}
      SENTRY_DSN: ${PROD_SENTRY_DSN:-}
    volumes:
      - backend_uploads:/app/uploads
      - ./logs/backend:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - valuadis_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2

  # Vue.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_API_BASE_URL: ${PROD_NUXT_PUBLIC_API_BASE_URL:?Set PROD_NUXT_PUBLIC_API_BASE_URL for production}
    container_name: valuadis_frontend
    environment:
      NUXT_PUBLIC_API_BASE_URL: ${PROD_NUXT_PUBLIC_API_BASE_URL:?Set PROD_NUXT_PUBLIC_API_BASE_URL for production}
      ENVIRONMENT: production
      NUXT_PUBLIC_SENTRY_DSN: ${PROD_NUXT_PUBLIC_SENTRY_DSN:-}
    depends_on:
      - backend
    networks:
      - valuadis_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local
  redis_data:
    driver: local

networks:
  valuadis_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
