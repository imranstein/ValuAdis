services:
  # PostgreSQL with PostGIS (real dev/staging/prod database engine).
  # Mirrors docker-compose.prod.yml so the full Alembic chain — including
  # migration 001's `CREATE EXTENSION postgis` — runs identically in local dev.
  # This is the supported local database; the SQLite spatial stubs in
  # backend/app/core/dev_schema.py are for lightweight unit tests only.
  db:
    image: postgis/postgis:15-3.3
    container_name: valuadis_db
    environment:
      POSTGRES_DB: valuadis
      POSTGRES_USER: valuadis_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Host 5433 avoids clashing with a native Homebrew Postgres on 5432.
    # The DATABASE_URL used from the host therefore targets localhost:5433.
    ports:
      - "5433:5432"
    networks:
      - valuadis_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valuadis_user -d valuadis"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: valuadis_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    ports:
      - "6379:6379"
    networks:
      - valuadis_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: valuadis_backend
    environment:
      DATABASE_URL: postgresql://valuadis_user:${DB_PASSWORD:-changeme}@db:5432/valuadis
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY:-}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET:-}
      MPESA_SHORTCODE: ${MPESA_SHORTCODE:-}
      MPESA_PASSKEY: ${MPESA_PASSKEY:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    ports:
      - "8020:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - valuadis_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Vue.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: valuadis_frontend
    working_dir: /app/app
    environment:
      NUXT_PUBLIC_API_BASE_URL: ${NUXT_PUBLIC_API_BASE_URL:-http://localhost:8020}
      VALUADIS_LOCAL_BROWSER_PROOF: ${VALUADIS_LOCAL_BROWSER_PROOF:-true}
      VALUADIS_ENFORCE_PRODUCTION_CONFIG: ${VALUADIS_ENFORCE_PRODUCTION_CONFIG:-false}
    volumes:
      - ./frontend:/app
    ports:
      - "3020:3020"
    depends_on:
      - backend
    networks:
      - valuadis_network
    command: sh -c "npm install --force && npm run build && HOST=0.0.0.0 PORT=3020 npm run preview"

volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  valuadis_network:
    driver: bridge
