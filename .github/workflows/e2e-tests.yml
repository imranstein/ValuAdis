name: E2E Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: valuadis_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        # 3.11 matches the backend's actual runtime (backend/Dockerfile is
        # python:3.11-slim) and every other workflow. This job was the lone
        # 3.9 outlier; the security-patched backend deps (python-multipart
        # >=0.0.21, etc.) require Python >=3.10, so 3.9 can no longer install
        # requirements.txt.
        python-version: '3.11'
        cache: 'pip'

    - name: Install backend dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run database migrations
      working-directory: ./backend
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/valuadis_test
      run: |
        alembic upgrade head

    - name: Start backend server
      working-directory: ./backend
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/valuadis_test
        JWT_SECRET: test-secret-key
      run: |
        uvicorn app.main:app --host 0.0.0.0 --port 8020 &
        sleep 10

    - name: Wait for backend readiness
      run: |
        for i in $(seq 1 30); do
          if curl -fsS http://localhost:8020/health > /dev/null; then
            echo "Backend is ready"
            break
          fi
          echo "Waiting for backend ($i/30)"
          sleep 2
        done

        if ! curl -fsS http://localhost:8020/health > /dev/null; then
          echo "::error::Backend did not become healthy in time."
          exit 1
        fi

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm install --legacy-peer-deps

    - name: Install Playwright Browsers
      working-directory: ./frontend
      run: npx playwright install --with-deps

    - name: Run E2E tests
      working-directory: ./frontend
      run: npm run test:e2e

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: frontend/playwright-report/
        retention-days: 30

    - name: Upload test screenshots
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: test-screenshots
        path: frontend/test-results/
        retention-days: 7

    - name: Upload test videos
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: test-videos
        path: frontend/test-results/**/*.webm
        retention-days: 7
