name: Performance Tests

# The full 100-VU baseline-comparison load (K6_PROFILE=full) needs a stable,
# production-like target to produce a meaningful ms-level regression signal —
# a freshly-booted single-worker dev backend on a shared PR runner is not
# that target. So PRs get a short "smoke" pass (proves the live API handles
# light concurrent traffic without erroring); the full baseline-gated load
# test runs on a schedule / manual dispatch instead. See k6-load-test.js.
on:
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 3 * * 1' # weekly, Monday 03:00 UTC — full baseline profile
  workflow_dispatch: {}

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'
  # Baseline thresholds — update after an intentional performance improvement
  BASELINE_P95_MS: '500'
  BASELINE_P99_MS: '1000'
  BASELINE_RPS: '50'

jobs:
  k6-performance:
    name: K6 Load Tests with Baseline Comparison
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_USER: testuser
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Migrate database to head
        env:
          DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/testdb
          JWT_SECRET: test-secret-key
        run: |
          cd backend
          alembic upgrade head

      - name: Start backend server
        env:
          DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/testdb
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key
          JWT_SECRET: test-secret-key
          # development (not "testing"): app.main gates /openapi.json, /docs,
          # /redoc behind ENVIRONMENT == "development" — k6 doesn't need those,
          # but this keeps the CI-booted backend consistent with the OWASP ZAP
          # job, which does (ZAP scans /openapi.json).
          ENVIRONMENT: development
        run: |
          cd backend
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > ../backend-server.log 2>&1 &
          echo "Waiting for backend to become healthy..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/v1/health > /dev/null; then
              echo "Backend is healthy."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Backend did not become healthy in time."
          cat ../backend-server.log
          exit 1

      - name: Seed load-test fixtures (user + property)
        id: seed
        run: |
          set -e
          LT_EMAIL="loadtest@valuadis.example"
          LT_PASSWORD="LoadTest@123!"

          register_response=$(curl -sf -X POST http://localhost:8000/api/v1/auth/register \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"${LT_EMAIL}\",\"full_name\":\"Load Test User\",\"phone\":\"+251911000001\",\"password\":\"${LT_PASSWORD}\",\"municipality\":\"Addis Ababa\",\"license_number\":\"VAL-LOADTEST-001\"}")
          access_token=$(echo "$register_response" | python3 -c "import json,sys; print(json.load(sys.stdin)['data']['access_token'])")

          property_response=$(curl -sf -X POST http://localhost:8000/api/v1/properties \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${access_token}" \
            -d '{"address":"Bole, Addis Ababa","municipality":"Addis Ababa","property_type":"residential","area_sqm":120.0,"coordinates":[[38.7578,9.0320],[38.7580,9.0320],[38.7580,9.0318],[38.7578,9.0318],[38.7578,9.0320]]}')
          property_id=$(echo "$property_response" | python3 -c "import json,sys; print(json.load(sys.stdin)['data']['id'])")

          curl -sf -X POST http://localhost:8000/api/v1/valuations/ \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${access_token}" \
            -d "{\"property_id\":${property_id},\"property_type\":\"residential\",\"municipality\":\"Addis Ababa\",\"area_sqm\":120.0,\"coordinates\":[[38.7578,9.0320],[38.7580,9.0320],[38.7580,9.0318],[38.7578,9.0318],[38.7578,9.0320]]}" \
            > /dev/null

          echo "LT_EMAIL=${LT_EMAIL}" >> "$GITHUB_ENV"
          echo "LT_PASSWORD=${LT_PASSWORD}" >> "$GITHUB_ENV"
          echo "LT_PROPERTY_ID=${property_id}" >> "$GITHUB_ENV"

      - name: Install K6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update -qq
          sudo apt-get install -y k6

      - name: Create reports directory
        run: mkdir -p reports/performance

      - name: Determine load profile
        id: profile
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "profile=full" >> "$GITHUB_OUTPUT"
          else
            echo "profile=smoke" >> "$GITHUB_OUTPUT"
          fi

      - name: Run K6 load test
        env:
          BASE_URL: http://localhost:8000
          K6_PROFILE: ${{ steps.profile.outputs.profile }}
        run: |
          k6 run \
            --out json=reports/performance/k6-raw.json \
            --summary-export=reports/performance/k6-summary.json \
            -e BASE_URL="$BASE_URL" \
            -e K6_PROFILE="$K6_PROFILE" \
            -e LT_EMAIL="$LT_EMAIL" \
            -e LT_PASSWORD="$LT_PASSWORD" \
            -e LT_PROPERTY_ID="$LT_PROPERTY_ID" \
            tests/performance/k6-load-test.js \
            || echo "K6_FAILED=1" >> "$GITHUB_ENV"

      - name: Baseline comparison and regression detection
        env:
          BASELINE_P95_MS: ${{ env.BASELINE_P95_MS }}
          BASELINE_P99_MS: ${{ env.BASELINE_P99_MS }}
          BASELINE_RPS: ${{ env.BASELINE_RPS }}
          LOAD_PROFILE: ${{ steps.profile.outputs.profile }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys

          profile = os.environ["LOAD_PROFILE"]
          summary_path = "reports/performance/k6-summary.json"
          if not os.path.exists(summary_path):
              print("::warning::K6 summary not found — skipping baseline comparison")
              sys.exit(0)

          with open(summary_path) as f:
              data = json.load(f)

          metrics = data.get("metrics", {})

          def get_metric(name, stat):
              m = metrics.get(name, {})
              vals = m.get("values", m)
              return vals.get(stat, 0) or 0

          p95 = get_metric("http_req_duration", "p(95)")
          p99 = get_metric("http_req_duration", "p(99)")
          rps = get_metric("http_reqs", "rate")

          baseline_p95 = float(os.environ["BASELINE_P95_MS"])
          baseline_p99 = float(os.environ["BASELINE_P99_MS"])
          baseline_rps = float(os.environ["BASELINE_RPS"])

          def pct_change(current, baseline):
              if baseline == 0:
                  return 0.0
              return ((current - baseline) / baseline) * 100.0

          p95_chg = pct_change(p95, baseline_p95)
          p99_chg = pct_change(p99, baseline_p99)
          rps_chg = pct_change(rps, baseline_rps)

          report_lines = [
              f"## Performance Baseline Comparison ({profile} profile)",
              "",
              "| Metric | Baseline | Measured | Change |",
              "|--------|----------|----------|--------|",
              f"| p95 latency | {baseline_p95:.0f} ms | {p95:.1f} ms | {p95_chg:+.1f}% |",
              f"| p99 latency | {baseline_p99:.0f} ms | {p99:.1f} ms | {p99_chg:+.1f}% |",
              f"| Requests/s  | {baseline_rps:.0f}    | {rps:.1f}    | {rps_chg:+.1f}% |",
              "",
          ]

          if profile != "full":
              report_lines.append(
                  "> Smoke profile (light concurrency, PR-scoped): baseline "
                  "comparison is informational only. The full 100-VU "
                  "baseline-gated load test runs weekly / on-demand — see "
                  "`workflow_dispatch` and the Monday schedule on this workflow."
              )
              report = "\n".join(report_lines)
              print(report)
              step_summary = os.environ.get("GITHUB_STEP_SUMMARY", "")
              if step_summary:
                  with open(step_summary, "a") as f:
                      f.write(report + "\n")
              sys.exit(0)

          regressions = []
          # Flag if latency degrades >20% or throughput drops >20%
          if p95_chg > 20:
              regressions.append(f"p95 latency regression: {p95_chg:+.1f}%")
          if p99_chg > 20:
              regressions.append(f"p99 latency regression: {p99_chg:+.1f}%")
          if rps_chg < -20:
              regressions.append(f"Throughput regression: {rps_chg:+.1f}%")

          if regressions:
              report_lines.append("### Regressions Detected")
              for r in regressions:
                  report_lines.append(f"- {r}")
              report_lines.append("")
              report_lines.append("> **Build flagged:** performance regressions detected.")

          report = "\n".join(report_lines)
          print(report)

          step_summary = os.environ.get("GITHUB_STEP_SUMMARY", "")
          if step_summary:
              with open(step_summary, "a") as f:
                  f.write(report + "\n")

          if regressions:
              print("::error::Performance regressions detected. See step summary.")
              sys.exit(1)

          print("::notice::All performance metrics within acceptable baseline thresholds.")
          PYEOF

      - name: Fail if K6 itself errored
        if: env.K6_FAILED == '1'
        run: |
          echo "::error::K6 run reported failed thresholds/checks. See reports/performance and job log."
          exit 1

      - name: Upload performance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-reports-${{ github.run_number }}
          path: |
            reports/performance/
            backend-server.log
          retention-days: 30
